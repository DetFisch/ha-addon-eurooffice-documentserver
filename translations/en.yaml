configuration:
  jwt_enabled:
    name: JWT enabled
    description: Enable JWT validation for Document Server integrations.
  jwt_secret:
    name: JWT secret
    description: Shared secret for integrations. Leave empty to let Euro-Office generate and persist one.
  jwt_header:
    name: JWT header
    description: HTTP header carrying the JWT token.
  example_enabled:
    name: Example app
    description: Enable the built-in example app. Do not expose it on untrusted networks.
  wopi_enabled:
    name: WOPI enabled
    description: Enable WOPI protocol support.
  allow_private_ip_address:
    name: Allow private IP addresses
    description: Allow fetching documents from private network addresses.
  generate_fonts:
    name: Generate fonts
    description: Regenerate the font cache during startup.
  nginx_worker_processes:
    name: Nginx worker processes
    description: Number of nginx worker processes inside the container.
network:
  80/TCP: Euro-Office Document Server web interface and API.
