name: "Euro-Office Document Server"
version: "0.1.0"
slug: "eurooffice_documentserver"
description: "Euro-Office Document Server packaged as a Home Assistant app"
url: "https://github.com/Euro-Office/DocumentServer"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  80/tcp: 8080
webui: "http://[HOST]:[PORT:80]/"
watchdog: "http://[HOST]:[PORT:80]/healthcheck"
options:
  jwt_enabled: true
  jwt_secret: ""
  jwt_header: "Authorization"
  example_enabled: false
  wopi_enabled: false
  allow_private_ip_address: false
  generate_fonts: true
  nginx_worker_processes: 1
schema:
  jwt_enabled: bool
  jwt_secret: password?
  jwt_header: "str"
  example_enabled: bool
  wopi_enabled: bool
  allow_private_ip_address: bool
  generate_fonts: bool
  nginx_worker_processes: "int(1,)"
